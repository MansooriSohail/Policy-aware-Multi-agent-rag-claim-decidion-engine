[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-indexer"
version = "0.1.0"
description = "Policy ingestion and indexing pipeline for the Aptino claim-assessment assignment."
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "sentence-transformers>=2.7.0",
  "faiss-cpu>=1.8.0",
  "rank-bm25>=0.2.2",
  "pydantic>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
